<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#0a0a0e;}
::-webkit-scrollbar-thumb{background:#1e2030;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#2a2e40;}
html,body{width:100%;height:100%;overflow:hidden;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}
:root{--bg:#050508;--fg:#d8dae4;--card:#0b0b10;--card-fg:#d8dae4;--primary:#b8bcc8;--primary-fg:#0a0a0e;--secondary:#141418;--secondary-fg:#8892a8;--muted:#0e0e14;--muted-fg:#4a5068;--accent:#22b960;--destructive:#c04030;--border:#161820;--input:#121218;--emerald:#34d399;--emerald-bg:rgba(52,211,153,.08);--emerald-brd:rgba(52,211,153,.15);--blue:#60a5fa;--blue-bg:rgba(96,165,250,.08);--blue-brd:rgba(96,165,250,.15);--amber:#fbbf24;--amber-bg:rgba(251,191,36,.08);--amber-brd:rgba(251,191,36,.15);--zinc:#a1a1aa;--zinc-bg:rgba(161,161,170,.08);--zinc-brd:rgba(161,161,170,.15);--gold:#c8a830;--radius:12px;--indigo:#818cf8;--indigo-bg:rgba(129,140,248,.08);--indigo-brd:rgba(129,140,248,.15);}
body{background:var(--bg);color:var(--fg);}
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}
.header{position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.03);background:rgba(5,5,8,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 24px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.hdr-left{display:flex;align-items:center;gap:12px;}
.hdr-logo{width:40px;height:40px;border-radius:12px;background:rgba(200,168,48,.1);border:1px solid rgba(200,168,48,.15);display:flex;align-items:center;justify-content:center;}
.hdr-logo svg{width:20px;height:20px;color:#c8a830;}
.hdr-title{font-size:18px;font-weight:700;color:var(--fg);}
.hdr-sub{font-size:11px;color:var(--muted-fg);}
.hdr-close{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted-fg);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.hdr-close:hover{background:var(--secondary);color:var(--fg);}
.main{flex:1;overflow-y:auto;padding:20px 24px 28px;}
.main>*+*{margin-top:20px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat-card{background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-icon svg{width:20px;height:20px;}
.stat-icon.emerald{background:rgba(52,211,153,.1);color:var(--emerald);}
.stat-icon.blue{background:rgba(96,165,250,.1);color:var(--blue);}
.stat-icon.amber{background:rgba(251,191,36,.1);color:var(--amber);}
.stat-icon.primary{background:rgba(200,168,48,.08);color:var(--gold);}
.stat-label{font-size:11px;color:var(--muted-fg);}
.stat-val{font-size:14px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tabs{display:inline-flex;gap:2px;padding:3px;background:rgba(14,14,20,.5);border-radius:10px;}
.tab{padding:7px 16px;font-size:12px;font-weight:500;color:var(--muted-fg);background:transparent;border:none;border-radius:7px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;}
.tab svg{width:16px;height:16px;}
.tab:hover{color:var(--secondary-fg);}
.tab.on{background:var(--secondary);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.f-search{position:relative;flex:1;min-width:200px;}
.f-search input{width:100%;padding:9px 12px 9px 34px;background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);color:var(--fg);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;}
.f-search input:focus{border-color:rgba(184,188,200,.3);}
.f-search input::placeholder{color:var(--muted-fg);}
.f-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted-fg);pointer-events:none;}
.f-select{padding:9px 14px;background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);color:var(--fg);font-size:12px;font-family:inherit;outline:none;cursor:pointer;-webkit-appearance:none;min-width:140px;}
.f-toggle{display:flex;gap:6px;margin-top:-10px;}
.f-tog{padding:6px 14px;font-size:11px;font-weight:500;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted-fg);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.f-tog svg{width:14px;height:14px;}
.f-tog:hover{color:var(--fg);border-color:rgba(42,44,58,.8);}
.f-tog.on{background:var(--secondary);color:var(--fg);border-color:rgba(42,44,58,.8);}
.f-reset{padding:6px 12px;font-size:11px;color:var(--muted-fg);background:transparent;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;transition:color .15s;}
.f-reset svg{width:14px;height:14px;}
.f-reset:hover{color:var(--fg);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr);}}
.pcard{background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .25s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.pcard:hover{border-color:rgba(184,188,200,.25);box-shadow:0 4px 20px rgba(184,188,200,.04);}
.pc-img{position:relative;width:100%;padding-top:62.5%;overflow:hidden;background:#08080c;}
.pc-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;}
.pc-img-ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a10 0%,#0e0e16 100%);}
.pc-img-ph svg{width:32px;height:32px;color:#14161e;opacity:.7;}
.pc-img-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,27,36,.9) 0%,rgba(26,27,36,.15) 40%,transparent 100%);pointer-events:none;}
.pc-badges{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:5px;}
.badge{padding:3px 9px;font-size:10px;font-weight:600;border-radius:6px;border:1px solid;line-height:1.4;}
.badge.available{background:var(--emerald-bg);color:var(--emerald);border-color:var(--emerald-brd);}
.badge.owned{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-brd);}
.badge.sold{background:var(--zinc-bg);color:var(--zinc);border-color:var(--zinc-brd);}.badge.sublease{background:var(--indigo-bg);color:var(--indigo);border-color:var(--indigo-brd);}
.badge.type-b{background:rgba(5,5,8,.8);color:var(--secondary-fg);border-color:transparent;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.badge.timer{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-brd);display:flex;align-items:center;gap:4px;}
.badge.timer svg{width:11px;height:11px;}
.pc-timer{position:absolute;right:10px;top:10px;}
.pc-bottom-text{position:absolute;bottom:10px;left:12px;right:12px;}
.pc-name{font-size:15px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-addr{font-size:11px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.pc-body{padding:14px;}
.pc-price-row{display:flex;align-items:baseline;justify-content:space-between;}
.pc-price{font-size:20px;font-weight:800;color:var(--gold);letter-spacing:-.3px;}
.pc-rent{font-size:11px;color:var(--muted-fg);}
.pc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.pc-chip{display:flex;align-items:center;gap:4px;padding:4px 8px;font-size:10px;color:var(--muted-fg);background:rgba(14,14,20,.5);border-radius:6px;}
.pc-chip svg{width:13px;height:13px;}
.pc-btns{display:flex;gap:6px;margin-top:12px;}
.btn{padding:8px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;border:1px solid;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;font-family:inherit;}
.btn svg{width:15px;height:15px;}
.btn-outline{background:transparent;border-color:var(--border);color:var(--fg);}
.btn-outline:hover{background:var(--secondary);}
.btn-primary{background:rgba(200,168,48,.12);border-color:rgba(200,168,48,.25);color:#c8a830;}
.btn-primary:hover{background:rgba(200,168,48,.2);border-color:rgba(200,168,48,.35);}
.btn-primary:disabled{opacity:.4;cursor:default;filter:none;}
.btn-secondary{background:var(--secondary);border-color:var(--border);color:var(--secondary-fg);}
.btn-secondary:hover{background:rgba(20,20,28,.8);}
.btn-destructive{background:rgba(192,64,48,.12);border-color:rgba(192,64,48,.25);color:var(--destructive);}
.btn-destructive:hover{background:rgba(192,64,48,.2);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted-fg);}
.btn-ghost:hover{color:var(--fg);}
.detail-grid{display:grid;gap:20px;grid-template-columns:1fr 1fr;}
.d-img-wrap{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:var(--radius);background:#08080c;}
.d-img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.d-img-ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a10,#0e0e16);}
.d-img-ph svg{width:48px;height:48px;color:#14161e;}
.d-badges{position:absolute;left:14px;top:14px;display:flex;gap:6px;}
.d-timer{position:absolute;right:14px;top:14px;}
.d-owner{background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;margin-top:12px;}
.d-owner-ava{width:40px;height:40px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.d-owner-ava svg{width:20px;height:20px;color:var(--muted-fg);}
.d-owner-lbl{font-size:12px;color:var(--muted-fg);}
.d-owner-name{font-size:14px;font-weight:600;color:var(--fg);}
.d-right>*+*{margin-top:16px;}
.d-title{font-size:26px;font-weight:700;color:var(--fg);}
.d-addr{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-fg);margin-top:4px;}
.d-addr svg{width:15px;height:15px;}
.d-price-row{display:flex;flex-wrap:wrap;gap:12px;}
.d-price-card{flex:1;min-width:140px;padding:14px;border-radius:var(--radius);}
.d-price-card.buy{background:rgba(184,188,200,.04);border:1px solid rgba(212,168,48,.15);}
.d-price-card.rent{background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);}
.d-price-lbl{font-size:11px;color:var(--muted-fg);}
.d-price-val{font-size:22px;font-weight:800;margin-top:2px;}
.d-price-val.gold{color:var(--gold);}
.d-price-val.white{color:var(--fg);}
.d-price-tax{font-size:10px;color:var(--muted-fg);margin-top:2px;}
.d-specs-card{background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);overflow:hidden;}
.d-specs-title{padding:14px 14px 10px;font-size:14px;font-weight:600;color:var(--fg);}
.d-specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0 14px 14px;}
.d-spec{display:flex;align-items:center;gap:10px;padding:8px 0;}
.d-spec-icon{width:40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.d-spec-icon svg{width:20px;height:20px;color:var(--muted-fg);}
.d-spec-lbl{font-size:11px;color:var(--muted-fg);}
.d-spec-val{font-size:13px;font-weight:600;color:var(--fg);}
.d-desc-card{background:rgba(8,8,12,.5);border:1px solid rgba(22,24,32,.35);border-radius:var(--radius);padding:14px;}
.d-desc-title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:8px;}
.d-desc-text{font-size:13px;color:var(--muted-fg);line-height:1.7;}
.d-sep{height:1px;background:var(--border);margin:0;}
.d-actions>*+*{margin-top:8px;}
.d-actions .btn{padding:12px;font-size:13px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;text-align:center;}
.empty-circle{width:64px;height:64px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.empty-circle svg{width:32px;height:32px;color:var(--muted-fg);}
.empty-title{font-size:16px;font-weight:600;color:var(--fg);margin-bottom:4px;}
.empty-sub{font-size:12px;color:var(--muted-fg);}
#notif-stack{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:300px;}
.notif{border-radius:10px;padding:12px 16px;background:rgba(5,5,8,.96);border:1px solid var(--border);position:relative;overflow:hidden;animation:nIn .2s ease;}
.notif .n-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
.notif.success .n-bar{background:var(--accent);}
.notif.error .n-bar{background:var(--destructive);}
.notif.info .n-bar{background:#b8bcc8;}
.n-txt{font-size:12px;color:var(--secondary-fg);padding-left:10px;}
@keyframes nIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

.sublease-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);}
.sublease-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:340px;max-width:90vw;}
.sublease-box h3{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:16px;}
.sublease-field{margin-bottom:12px;}
.sublease-field label{font-size:11px;color:var(--muted-fg);display:block;margin-bottom:4px;}
.sublease-field input[type=number]{width:100%;padding:8px 10px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-size:13px;font-family:inherit;outline:none;}
.sublease-field input:focus{border-color:rgba(129,140,248,.4);}
.sublease-field select{width:100%;padding:8px 10px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-size:13px;font-family:inherit;outline:none;cursor:pointer;}
.sublease-btns{display:flex;gap:8px;margin-top:16px;}
.btn-indigo{background:rgba(129,140,248,.12);border-color:rgba(129,140,248,.25);color:var(--indigo);}
.btn-indigo:hover{background:rgba(129,140,248,.2);}
</style>
</head>
<body>
<div id="notif-stack"></div>
<div id="app">
  <div class="header">
    <div class="hdr-left">
      <div class="hdr-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></div>
      <div><div class="hdr-title">Genesis Homes</div><div class="hdr-sub">Immobilier de luxe</div></div>
    </div>
    <button class="hdr-close" onclick="bridge('close',{})">â</button>
  </div>
  <div class="main" id="main"></div>
</div>
<script>

// ============================================================
// SUBLEASE SYSTEM
// ============================================================
var subleaseModal=null;

function getSubleaseStatus(h){
  if(!h)return null;
  if(!h.sublease_enabled&&!h.sublease_active)return null;
  if(h.sublease_active)return{label:'Sous-loué',type:'sublease'};
  if(h.sublease_enabled)return{label:'À louer',type:'sublease'};
  return null;
}

function openSubleaseModal(h){
  if(subleaseModal){subleaseModal.remove();subleaseModal=null;}
  var id=h.id;
  var div=document.createElement('div');
  div.className='sublease-modal';
  div.innerHTML=
    '<div class="sublease-box">'+
    '<h3>⚑ Sous-location — '+h.name+'</h3>'+
    '<div class="sublease-field"><label>Prix par jour ($)</label>'+
    '<input type="number" id="sl-price" min="0" value="'+(h.sublease_price||0)+'"></div>'+
    '<div class="sublease-field"><label>Durée max (jours)</label>'+
    '<select id="sl-days">'+
    [1,2,3,5,7,14,30].map(function(d){return'<option value="'+d+'"'+(h.sublease_max_days==d?' selected':'')+'>'+d+' jour'+(d>1?'s':'')+'</option>';}).join('')+
    '</select></div>'+
    '<div class="sublease-btns">'+
    '<button class="btn btn-indigo" onclick="confirmSubleaseSet('+id+',true)">Activer</button>'+
    (h.sublease_enabled?'<button class="btn btn-destructive" onclick="confirmSubleaseSet('+id+',false)">Désactiver</button>':'')+
    (h.sublease_active?'<button class="btn btn-destructive" onclick="doSubleaseEnd('+id+')">Expulser locataire</button>':'')+
    '<button class="btn btn-outline" onclick="closeSubleaseModal()">Annuler</button>'+
    '</div>'+
    (h.sublease_active?'<p style="margin-top:12px;font-size:11px;color:var(--muted-fg)">Locataire actuel : '+h.sublease_tenant_name+'</p>':'')+
    '</div>';
  document.body.appendChild(div);
  subleaseModal=div;
  div.addEventListener('click',function(e){if(e.target===div)closeSubleaseModal();});
}

function closeSubleaseModal(){if(subleaseModal){subleaseModal.remove();subleaseModal=null;}}

function confirmSubleaseSet(id,enabled){
  var price=parseInt(document.getElementById('sl-price').value)||0;
  var days=parseInt(document.getElementById('sl-days').value)||1;
  bridge('sublease_set',{id:id,price:price,days:days,enabled:enabled});
  closeSubleaseModal();
}

function doSubleaseEnd(id){
  bridge('sublease_end',{id:id});
  closeSubleaseModal();
}

function doSubleaseRent(id,days){
  bridge('sublease_rent',{id:id,days:days});
  notify("Demande de sous-location envoyée.",'info');
  backToList();
}

function openSubleaseRentModal(h){
  if(subleaseModal){subleaseModal.remove();subleaseModal=null;}
  var id=h.id;
  var maxD=h.sublease_max_days||7;
  var daysArr=[];
  for(var d=1;d<=maxD;d++)daysArr.push(d);
  var div=document.createElement('div');
  div.className='sublease-modal';
  div.innerHTML=
    '<div class="sublease-box">'+
    '<h3>🏠 Louer — '+h.name+'</h3>'+
    '<p style="font-size:12px;color:var(--muted-fg);margin-bottom:12px;">Prix : '+fmt(h.sublease_price)+' / jour</p>'+
    '<div class="sublease-field"><label>Durée (jours)</label>'+
    '<select id="sl-rent-days">'+
    daysArr.map(function(d){return'<option value="'+d+'">'+d+' jour'+(d>1?'s':'')+' — '+fmt(h.sublease_price*d)+'</option>';}).join('')+
    '</select></div>'+
    '<div class="sublease-btns">'+
    '<button class="btn btn-indigo" onclick="doSubleaseRent('+id+',parseInt(document.getElementById('sl-rent-days').value))">Confirmer</button>'+
    '<button class="btn btn-outline" onclick="closeSubleaseModal()">Annuler</button>'+
    '</div></div>';
  document.body.appendChild(div);
  subleaseModal=div;
  div.addEventListener('click',function(e){if(e.target===div)closeSubleaseModal();});
}

</script>
